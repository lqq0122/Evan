<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Evan</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#f2f2f7; color:#1c1c1e;
    display:flex; justify-content:center;
  }
  #app {
    width:100%; max-width:480px; height:100vh;
    background:#fff; position:relative; display:flex; flex-direction:column;
    overflow:hidden;
  }
  .page { flex:1; display:none; flex-direction:column; }
  .page.active { display:flex; }

  /* 通用顶栏 */
  .topbar {
    height:52px; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; background:#fff;
    border-bottom:1px solid #e5e5ea; flex-shrink:0; position:relative;
  }

  /* ---------- 登录页 ---------- */
  .login-wrap {
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:0 28px;
  }
  .login-logo { text-align:center; font-size:26px; font-weight:700; margin-bottom:36px; color:#1c1c1e; }
  .login-logo span { color:#0a84ff; }
  .login-input {
    width:100%; height:48px; border:1px solid #d1d1d6; border-radius:10px;
    padding:0 14px; font-size:16px; background:#fff; outline:none;
    margin-bottom:16px;
  }
  .login-input:focus { border-color:#0a84ff; }
  .btn-primary {
    width:100%; height:48px; border:none; border-radius:10px;
    background:#0a84ff; color:#fff; font-size:17px; font-weight:600;
    cursor:pointer;
  }
  .btn-primary:active { opacity:.8; }
  .login-tip { margin-top:14px; text-align:center; font-size:14px; color:#ff3b30; min-height:20px; }

  /* ---------- 会话列表页 ---------- */
  .header-user {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:#fff; border-bottom:1px solid #e5e5ea; flex-shrink:0;
  }
  .header-user .me { display:flex; align-items:center; gap:10px; }
  .avatar {
    width:36px; height:36px; border-radius:50%; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    background:#0a84ff; color:#fff; font-size:15px; font-weight:600;
    overflow:hidden; flex-shrink:0;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .me-name { font-size:15px; font-weight:500; }
  .btn-new {
    height:34px; padding:0 14px; border:none; border-radius:17px;
    background:#0a84ff; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-new:active { opacity:.8; }

  .conv-list { flex:1; overflow-y:auto; }
  .empty {
    text-align:center; color:#8e8e93; font-size:14px; margin-top:80px; padding:0 20px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 登录页 ============ -->
  <div class="page active" id="page-login">
    <div class="login-wrap">
      <div class="login-logo">My <span>Evan</span></div>
      <input class="login-input" id="login-nick" type="text" placeholder="输入昵称" maxlength="20" autocomplete="off">
      <button class="btn-primary" id="login-btn">进入</button>
      <div class="login-tip" id="login-tip"></div>
    </div>
  </div>

  <!-- ============ 会话列表页 ============ -->
  <div class="page" id="page-list">
    <div class="topbar">My Evan</div>
    <div class="header-user">
      <div class="me">
        <div class="avatar" id="me-avatar">?</div>
        <div class="me-name" id="me-name"></div>
      </div>
      <button class="btn-new" id="btn-new-chat">+ 发起</button>
    </div>
    <div class="conv-list" id="conv-list">
      <div class="empty">还没有聊天</div>
    </div>
  </div>

  <!-- 隐藏的文件选择：头像上传 -->
  <input type="file" id="avatar-file" accept="image/*" style="display:none">

</div>

<script>
/* =========================================================
   IndexedDB 封装
   store: users / rooms / wordcards / messages
   ========================================================= */
const DB_NAME = 'my_evan_db';
const DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('users')) {
        const s = d.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
        s.createIndex('nickname', 'nickname', { unique: true });
      }
      if (!d.objectStoreNames.contains('rooms')) {
        d.createObjectStore('rooms', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('wordcards')) {
        const s = d.createObjectStore('wordcards', { keyPath: 'id', autoIncrement: true });
        s.createIndex('owner_id', 'owner_id', { unique: false });
      }
      if (!d.objectStoreNames.contains('messages')) {
        const s = d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
        s.createIndex('room_id', 'room_id', { unique: false });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(store, mode) {
  return db.transaction(store, mode).objectStore(store);
}

function dbGetUserByNick(nick) {
  return new Promise((resolve, reject) => {
    const idx = tx('users', 'readonly').index('nickname');
    const req = idx.get(nick);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbAddUser(user) {
  return new Promise((resolve, reject) => {
    const req = tx('users', 'readwrite').add(user);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPutUser(user) {
  return new Promise((resolve, reject) => {
    const req = tx('users', 'readwrite').put(user);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetUser(id) {
  return new Promise((resolve, reject) => {
    const req = tx('users', 'readonly').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

/* =========================================================
   页面切换 & 登录逻辑
   ========================================================= */
let currentUser = null;

const $ = (id) => document.getElementById(id);

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + name).classList.add('active');
}

// 头像渲染：有图显示图，无图显示昵称首字
function renderAvatar(el, user) {
  if (user && user.avatar) {
    el.innerHTML = '<img src="' + user.avatar + '" alt="">';
  } else {
    const ch = user && user.nickname ? user.nickname.charAt(0).toUpperCase() : '?';
    el.textContent = ch;
  }
}

async function login() {
  const nick = $('login-nick').value.trim();
  const tip = $('login-tip');
  tip.textContent = '';

  if (!nick) { tip.textContent = '请输入昵称'; return; }

  try {
    let user = await dbGetUserByNick(nick);
    if (!user) {
      // 自动注册
      const id = await dbAddUser({
        nickname: nick,
        avatar: '',
        has_wordcard: 0,
        reply_speed: 10,
        created_at: Date.now()
      });
      user = { id, nickname: nick, avatar:'', has_wordcard:0, reply_speed:10, created_at: Date.now() };
    }
    currentUser = user;
    enterList();
  } catch (err) {
    console.error(err);
    tip.textContent = '出错了，请重试';
  }
}

function enterList() {
  $('me-name').textContent = currentUser.nickname;
  renderAvatar($('me-avatar'), currentUser);
  showPage('list');
}

/* =========================================================
   头像上传（会话列表页点自己头像）
   ========================================================= */
let avatarFileEl = $('avatar-file');
let avatarTarget = null;

$('me-avatar').addEventListener('click', () => {
  avatarTarget = 'me';
  avatarFileEl.value = '';
  avatarFileEl.click();
});

avatarFileEl.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result;
    if (avatarTarget === 'me' && currentUser) {
      currentUser.avatar = base64;
      await dbPutUser(currentUser);
      renderAvatar($('me-avatar'), currentUser);
    }
  };
  reader.readAsDataURL(file);
});

/* =========================================================
   启动
   ========================================================= */
$('login-btn').addEventListener('click', login);
$('login-nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

// 「发起」按钮先占位，下一步实现
$('btn-new-chat').addEventListener('click', () => {
  alert('发起聊天功能下一步实现');
});

openDB().then(() => {
  console.log('IndexedDB 就绪');
}).catch(err => {
  console.error('IndexedDB 打开失败', err);
  $('login-tip').textContent = '本地存储不可用';
});
</script>
</body>
</html>
